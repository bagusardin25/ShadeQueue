[project]
name = "shadequeue-api"
version = "0.1.0"
description = "ShadeQueue backend: FortyGuard-driven shade shelter allocation for a Phoenix corridor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.34,<0.40",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "geoalchemy2>=0.15,<0.19",
    "alembic>=1.14,<2",
    "httpx>=0.27,<0.29",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "ortools>=9.11,<9.15",
]

[project.optional-dependencies]
etl = [
    "geopandas>=1.0,<2",
    "pyogrio>=0.10,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a reachable PostGIS database (DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

# Lint configuration lives in the repository-root ruff.toml so that apps/api,
# scripts/, and migrations/ are all checked under one set of rules.
